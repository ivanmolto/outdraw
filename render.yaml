# Render Blueprint for the agent service (docs/ops.md). Web is on Vercel, not here.
services:
  - type: web
    name: outdraw-agent
    runtime: docker
    # Virginia sits next to Neon and Upstash us-east; the region can't change after creation.
    region: virginia
    # Paid instance: free ones spin down after 15 idle minutes (about a minute to wake) and
    # have no pre-deploy command or shell. Switch to `free` only to try the Blueprint.
    plan: 0.5c-512mb
    # No rootDir: Render's docs disagree on whether these paths are relative to it, and
    # the Blueprint import rejected the rootDir form. Repo-root paths are unambiguous, and
    # buildFilter below already limits builds to /agent.
    dockerfilePath: agent/Dockerfile
    dockerContext: agent
    # The image's CMD (docker/start.sh): harness readiness, migrations, uvicorn on PORT.
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: checksPass
    # Build filter paths are relative to the repo root, not rootDir.
    buildFilter:
      paths:
        - agent/**
    envVars:
      # Secrets: sync: false makes Render prompt for them once, at Blueprint creation; they
      # never live in this file or in the image.
      - key: QLOO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Optional: unset = Sentry off (docs/ops.md, Observability).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # The container has no ~/.qloo/config, so the harness needs both URLs from env.
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: QLOO_DAILY_CAP
        value: "300"
      - key: LLM_DAILY_TOKEN_CAP
        value: "2000000"
      - key: QLOO_CONCURRENCY
        value: "3"
      - key: QLOO_RECORD
        value: "0"
      # LIVE_MODE (the kill switch, docs/ops.md) is set in the dashboard only, never here: a
      # Blueprint sync would reset it. Unset means on.
