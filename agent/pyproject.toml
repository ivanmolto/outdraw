[project]
name = "draw"
version = "0.1.0"
description = "Outdraw agent service: Qloo-backed booking intelligence for live-music venues."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.151.0",
    "pydantic>=2.14.1",
    "redis>=5.2",
    "strands-agents[anthropic]>=1.61.1",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.15.1",
    "datamodel-code-generator==0.86.0",
    "asyncpg-stubs>=0.30",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real keys (skipped unless RUN_INTEGRATION=1)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# generated by scripts/gen_schemas.py; long lines come from schema descriptions
"draw/schemas.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["draw", "scripts", "tests"]
