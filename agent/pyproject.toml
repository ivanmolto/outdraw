[project]
name = "draw"
version = "0.1.0"
description = "Outdraw agent service: Qloo-backed booking intelligence for live-music venues."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real keys (skipped unless RUN_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["draw", "scripts", "tests"]
